# nano-kvrouter — BurstGPT trace replay configuration
#
# Replays BurstGPT (HPMLL, CC-BY-4.0) sample with SYNTHETIC prefix sharing.
#
# IMPORTANT — synthesis caveat:
# BurstGPT records contain (timestamp, request_tokens, response_tokens,
# session_id) but NO prefix structure. cache_hit numbers from this config
# reflect the prefix_synthesis HYPOTHESIS layered on top of real trace
# arrival/length, not observed BurstGPT prefix reuse. Treat them as such
# when reporting.
#
# Sensitivity: run
#   uv run python -m nano_kvrouter.cli prefix-sensitivity \
#     --config configs/trace_burstgpt.yaml --scheduler conductor
# to see how cache_hit varies across (zipf_alpha, p_local, num_buckets,
# sharing_layers) combinations.

cluster:
  prefill_nodes: 4
  decode_nodes: 4

node:
  gpu_blocks: 2000
  cpu_blocks: 0
  disk_blocks: 0
  capacity: 32

model:
  block_size: 16
  kv_bytes_per_token: 512
  prefill_cost_per_token_ms: 0.033
  decode_base_ms: 5.0
  marginal_decode_ms: 0.5
  prefill_chunk_size: 512

bandwidth:
  gpu_to_gpu: 300000000000.0
  gpu_to_cpu: 32000000000.0
  cpu_to_disk: 5000000000.0

slo:
  ttft_target_ms: 9999.0
  tbt_target_ms: 9999.0

workload:
  request_rate: 1.0           # ignored when trace is set
  duration_s: 1.0             # ignored when trace is set
  prefix_sharing_ratio: 0.0   # ignored
  avg_prompt_len: 1024
  avg_output_len: 256         # fallback only; trace has real output_length

generator:
  num_buckets: 1              # ignored when trace set
  vocab_size: 32000
  seed: 42

scheduler:
  name: conductor
  params:
    alpha: 1.0
    beta: 1.0
    gamma: 1.0

trace:
  path: ../traces/burstgpt/sample.jsonl
  speedup: 1.0
  max_requests: 2000
  prefix_mode: synthesis
  prefix_synthesis:
    num_buckets: 64
    zipf_alpha: 1.0
    p_local: 0.6
    local_window_s: 60.0
    sharing_layers:
      - [0.2, 0.5]
      - [0.5, 0.25]
      - [0.3, 0.0]
    seed: 42
