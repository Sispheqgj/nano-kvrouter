# nano-kvrouter — default demo configuration
#
# 10-second mini benchmark with prefix-heavy workload, designed to:
# - finish in < 1s real time per scheduler
# - produce clear differentiation between cache-aware vs cache-blind policies
# - never exhaust GPU pool under normal scheduling (no spurious MemoryError)

cluster:
  prefill_nodes: 4
  decode_nodes: 4

node:
  gpu_blocks: 2000
  cpu_blocks: 10000
  disk_blocks: 100000
  capacity: 32

model:
  block_size: 16
  kv_bytes_per_token: 512
  prefill_cost_per_token_ms: 0.033
  decode_base_ms: 5.0
  marginal_decode_ms: 0.5

bandwidth:
  gpu_to_gpu: 3.0e11
  gpu_to_cpu: 3.2e10
  cpu_to_disk: 5.0e9

slo:
  ttft_target_ms: 2000.0
  tbt_target_ms: 100.0

workload:
  request_rate: 50.0         # 50 req/s
  duration_s: 10.0           # 10s simulated → ~500 requests
  prefix_sharing_ratio: 0.6  # 60% of each prompt shared within bucket
  avg_prompt_len: 1024
  avg_output_len: 64         # 64 decode steps — keeps simulation tractable

generator:
  num_buckets: 10
  vocab_size: 32000
  seed: 42

scheduler:
  name: conductor
  params:
    alpha: 1.0
    beta: 1.0
    gamma: 1.0
