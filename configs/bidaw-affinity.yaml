# nano-kvrouter — Bidaw M3 session-affinity ship gate
#
# A3-only: session affinity on, previous-answer eviction off.

cluster:
  prefill_nodes: 1
  decode_nodes: 4

node:
  capacity: 16
  gpu_blocks: 80
  cpu_blocks: 16
  disk_blocks: 4000

model:
  block_size: 16
  kv_bytes_per_token: 4096
  prefill_cost_per_token_ms: 0.04
  decode_base_ms: 5.0
  marginal_decode_ms: 0.5
  prefill_chunk_size: 512

bandwidth:
  gpu_to_gpu: 3.0e11
  gpu_to_cpu: 3.2e10
  cpu_to_disk: 1.0e7
  contention_model: none

slo:
  ttft_target_ms: 5000.0
  tbt_target_ms: 100.0

workload:
  request_rate: 10.0
  duration_s: 1.0
  prefix_sharing_ratio: 0.0
  avg_prompt_len: 64
  avg_output_len: 16

generator:
  num_buckets: 1
  vocab_size: 32000
  seed: 42

trace:
  path: ../tests/fixtures/affinity_workload.jsonl
  max_requests: 60
  prefix_mode: session_history

scheduler:
  name: bidaw
  params:
    enable_session_affinity: true
    enable_answer_eviction: false
